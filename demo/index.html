<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Open Cameras Viewer — Demo</title>
  <meta name="description" content="Demo en vivo de Open Cameras Viewer: visor de múltiples cámaras usando streams públicos de cámaras de tráfico de Caltrans.">
  <link rel="icon" type="image/png" href="media/camera_icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1><span>Open Cameras Viewer</span></h1>
    <div class="camera-toggles" id="camera-toggles">
      <!-- Camera toggles will be dynamically created -->
    </div>
    <div class="controls">
      <label>Layout</label>
      <div class="select-wrapper">
        <select id="layout-select">
          <option value="1">1 Cámara</option>
          <option value="2">2 Cámaras</option>
          <option value="4" selected>4 Cámaras</option>
          <option value="6">6 Cámaras</option>
          <option value="7">7 Cámaras</option>
        </select>
      </div>
    </div>
  </header>

  <div class="demo-banner">
    <span class="demo-tag">DEMO</span>
    <span>Streams públicos en vivo de cámaras de tráfico de <a href="https://cwwp2.dot.ca.gov/vm/iframemap.htm" target="_blank" rel="noopener">Caltrans</a> (California DOT). No son cámaras privadas. El proyecto real usa cámaras RTSP locales vía go2rtc.</span>
    <a class="demo-repo" href="https://github.com/maximofn/open-cameras-viewer" target="_blank" rel="noopener">Código ↗</a>
  </div>

  <main>
    <div id="camera-grid" class="grid layout-4">
      <!-- Camera slots will be dynamically created -->
    </div>
  </main>

  <div id="backdrop" class="backdrop hidden"></div>

  <aside id="camera-selector" class="hidden">
    <h3>Seleccionar cámara</h3>
    <div id="camera-list"></div>
    <button id="close-selector">Cerrar</button>
  </aside>

  <script src="vendor/hls.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
